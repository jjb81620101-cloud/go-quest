<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Quest 🏌️ - 圍棋新手教學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="page-start" class="page active">
      <div class="floating-stones">
        <div class="stone s1">⚫</div><div class="stone s2">⚪</div><div class="stone s3">⚫</div><div class="stone s4">⚪</div>
      </div>
      <div class="start-content">
        <h1 class="title"><span class="title-icon">🏌️</span><span>Go Quest</span></h1>
        <p class="subtitle">踏上圍棋的奇妙旅程</p>
        <button class="btn btn-primary btn-lg" onclick="App.startGame()"><span>開始學習</span><span class="btn-arrow">→</span></button>
      </div>
    </section>

    <section id="page-character" class="page">
      <div class="page-header" style="text-align:center">
        <h2>選擇你的導師</h2>
        <p>每位導師都會用不同的方式教你下棋</p>
      </div>
      <div class="characters">
        <div class="character" onclick="App.selectCharacter('sage')">
          <div class="character-avatar sage"><span class="avatar-icon">🧙</span></div>
          <h3>圍棋智者</h3>
          <p class="character-desc">耐心引導，適合完全新手</p>
          <span class="difficulty-tag">難度：★☆☆</span>
        </div>
        <div class="character" onclick="App.selectCharacter('warrior')">
          <div class="character-avatar warrior"><span class="avatar-icon">⚔️</span></div>
          <h3>戰棋武士</h3>
          <p class="character-desc">注重實戰，適合有基礎</p>
          <span class="difficulty-tag">難度：★★☆</span>
        </div>
        <div class="character" onclick="App.selectCharacter('master')">
          <div class="character-avatar master"><span class="avatar-icon">👑</span></div>
          <h3>圍棋大師</h3>
          <p class="character-desc">高階技巧，挑戰高手</p>
          <span class="difficulty-tag">難度：★★★</span>
        </div>
      </div>
    </section>

    <section id="page-menu" class="page">
      <div class="page-header">
        <h2>主選單</h2>
        <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        <p class="progress-text">0/5 完成</p>
      </div>
      <nav style="flex-direction:column;gap:16px">
        <button class="btn btn-primary btn-lg" onclick="App.showBattle()">⚔️ 開始對戰</button>
        <button class="btn" onclick="App.showTutorial()">📖 圍棋教程</button>
        <button class="btn" onclick="App.showProblems()">🧩 死活題</button>
        <button class="btn" onclick="App.showJoseki()">🎯 定石學習</button>
        <button class="btn" onclick="App.showSettings()">⚙️ 設置</button>
      </nav>
    </section>

    <section id="page-battle" class="page">
      <div class="page-header">
        <h2>對戰模式</h2>
        <button class="btn" onclick="App.backToMenu()" style="position:absolute;right:0;top:0">← 返回</button>
      </div>
      <div class="battle-container">
        <div class="battle-board">
          <div id="go-board" class="go-board"></div>
        </div>
        <div class="battle-sidebar">
          <div id="turn-indicator" class="turn-indicator black">⚫ 你的回合</div>
          <div id="move-count" class="turn-indicator">手數：0</div>
          <div class="ai-settings">
            <h4>遊戲設置</h4>
            <div class="setting-row">
              <label>棋盤大小</label>
              <div style="display:flex;gap:8px">
                <button class="size-btn active" data-size="9" onclick="App.changeBoardSize(9)">9×9</button>
                <button class="size-btn" data-size="13" onclick="App.changeBoardSize(13)">13×13</button>
                <button class="size-btn" data-size="19" onclick="App.changeBoardSize(19)">19×19</button>
              </div>
            </div>
            <div class="setting-row">
              <label>AI 難度</label>
              <select onchange="App.changeDifficulty(this.value)">
                <option value="1">簡單</option>
                <option value="2" selected>中等</option>
                <option value="3">困難</option>
              </select>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn" onclick="App.undoMove()">↩️ 悔棋</button>
            <button class="btn" onclick="App.newGame()">🔄 新遊戲</button>
            <button class="btn" onclick="App.confirmExit()">🚪 退出</button>
          </div>
        </div>
      </div>
      <div id="game-result" class="game-result" style="display:none">
        <div class="result-content">
          <h2 id="result-title"></h2>
          <p id="result-message"></p>
          <div class="modal-buttons">
            <button class="btn btn-primary" onclick="App.newGame()">再來一局</button>
            <button class="btn" onclick="App.backToMenu()">返回主選單</button>
          </div>
        </div>
      </div>
    </section>

    <section id="page-tutorial" class="page">
      <div class="page-header">
        <h2>圍棋教程</h2>
        <p id="tutorial-chapter-label">第1章</p>
        <button class="btn" onclick="App.backToMenu()" style="position:absolute;right:0;top:0">← 返回</button>
      </div>
      <div style="display:flex;gap:24px">
        <div style="flex:1">
          <h3 id="tutorial-title"></h3>
          <div id="tutorial-body" class="tutorial-body"></div>
          <div style="display:flex;gap:12px;margin-top:24px">
            <button id="btn-prev-chapter" class="btn" onclick="App.prevChapter()">← 上一章</button>
            <button id="btn-next-chapter" class="btn btn-primary" onclick="App.nextChapter()">下一章 →</button>
          </div>
        </div>
      </div>
    </section>

    <section id="page-problems" class="page">
      <div class="page-header">
        <h2>死活題</h2>
        <button class="btn" onclick="App.backToMenu()" style="position:absolute;right:0;top:0">← 返回</button>
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div>
          <h3 id="problem-title"></h3>
          <p id="problem-desc" style="color:var(--text-light);margin:8px 0 16px"></p>
          <div id="problem-board" class="go-board small problem-board"></div>
          <div id="problem-feedback" class="problem-feedback"></div>
          <div style="display:flex;gap:12px;margin-top:16px">
            <button class="btn" onclick="App.showHint()">💡 提示</button>
            <button class="btn" onclick="App.skipProblem()">跳過 →</button>
          </div>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <span>積分: <strong id="problem-score">0</strong></span>
            <span>連續: <strong id="problem-streak">0</strong></span>
          </div>
          <div id="problems-grid" class="problems-grid"></div>
        </div>
      </div>
    </section>

    <section id="page-joseki" class="page">
      <div class="page-header">
        <h2>定石學習</h2>
        <button class="btn" onclick="App.backToMenu()" style="position:absolute;right:0;top:0">← 返回</button>
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div style="flex:1">
          <h3 id="joseki-name"></h3>
          <p id="joseki-desc" style="color:var(--text-light);margin:8px 0 16px"></p>
          <div id="joseki-demo-board" class="go-board small joseki-demo-board"></div>
          <div style="display:flex;gap:12px;margin-top:16px">
            <button class="btn" onclick="App.prevJoseki()">←</button>
            <button class="btn" onclick="App.nextJoseki()">→</button>
          </div>
        </div>
      </div>
    </section>

    <div id="modal-settings" class="modal">
      <div class="modal-content">
        <h3>設置</h3>
        <div class="setting-row"><label>顯示座標</label><input type="checkbox" checked onchange="App.toggleCoords(this.checked)"></div>
        <div class="setting-row"><label>音效</label><input type="checkbox" onchange="App.toggleSound(this.checked)"></div>
        <div class="setting-row"><label>計時器</label><input type="checkbox" onchange="App.toggleTimer(this.checked)"></div>
        <div class="modal-buttons"><button class="btn btn-primary" onclick="App.closeSettings()">關閉</button></div>
      </div>
    </div>

    <div id="modal-pause" class="modal">
      <div class="modal-content">
        <h3>遊戲暫停</h3>
        <p>確定要退出當前遊戲嗎？</p>
        <div class="modal-buttons">
          <button class="btn btn-primary" onclick="App.resumeGame()">繼續遊戲</button>
          <button class="btn" onclick="App.exitGame()">退出</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
